name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: npm ci

      - name: Build do app web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor (Android)
        run: npx cap sync android

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Permissão de execução do gradlew
        run: chmod +x android/gradlew

      - name: Gerar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheila-santos-nails-designer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
